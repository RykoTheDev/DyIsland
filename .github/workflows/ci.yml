name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: UI and main-process smoke test (real Electron; does not block the build)
        run: npm run test:ui
        continue-on-error: true
      - name: Check that the packaged app builds (unpacked, no installer)
        run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
